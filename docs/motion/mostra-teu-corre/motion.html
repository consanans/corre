<script>
// Corre · "Mostra teu corre": motion vertical de 33 s, 120 bpm (um tempo = 0,5 s).
// render(t) desenha o quadro do segundo t; nada depende do relógio, então o mesmo t dá sempre o mesmo quadro.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1080, H = 1920, B = 0.5, DUR = 33;
const C = { ink:'#141216', y:'#FFE800', p:'#FF48B0', bl:'#0067AE', s1:'#1A68CC', s2:'#4FA3EE', s3:'#B2E0FF',

const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, d) => cl((t - a) / d);
const bt = n => n * B;
const E = {
  oc: p => 1 - Math.pow(1 - p, 3), ic: p => p * p * p, iq: p => p * p,
  ioc: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,

// o golpe: vem grande, bate um pouco menor e assenta tremendo
function slam(t, t0, from = 2.2, d = 0.32) {
  if (t < t0) return 0;
  const p = cl((t - t0) / d);
  if (p < 0.42) return lerp(from, 0.9, E.ic(p / 0.42));
  const q = (p - 0.42) / 0.58; return 1 - 0.1 * Math.exp(-5 * q) * Math.cos(q * 9);
}
const pop = (t, t0, d = 0.32) => t < t0 ? 0 : E.ob(seg(t, t0, d));
const inA = (t, t0, d = 0.07) => seg(t, t0, d);

// ---------- os tremores, casados com os golpes da trilha ----------
const IMP = [[0,14],[0.5,14],[1,30],[2,14],[2.5,18],[3,10],[4,40],[4.5,16],[8,16],[10,20],[12,12],[14.25,10],[19,24],[21.5,30],
  [24,12],[24.5,12],[25,12],[25.5,12],[26,12],[26.5,12],[27,12],[27.5,14],[28.5,44],[29.25,16],[32,10]];
function shake(t) {
  let x = 0, y = 0, r = 0;

  return { x, y, r };
}

// ---------- desenho ----------
const STR = { xc:'extra-condensed', c:'condensed', sc:'semi-condensed', n:'normal', se:'semi-expanded', e:'expanded' };
function setF(o, size) {

// texto com as sombras duras empilhadas da marca; centraliza pela altura da maiúscula
function T(s, x, y, o = {}) {
  let size = o.size || 100;
  const sc = o.sc ?? 1; if (sc <= 0.001) return 0;
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); ctx.scale(sc * (o.sx || 1), sc * (o.sy || 1));
  if (o.a != null) ctx.globalAlpha *= cl(o.a);
  setF(o, size);
  if (o.maxW) { const m = ctx.measureText(s).width; if (m > o.maxW) { size *= o.maxW / m; setF(o, size); } }
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
  const asc = ctx.measureText('H').actualBoundingBoxAscent;
  const yo = o.base === 'top' ? asc : o.base === 'alpha' ? 0 : asc / 2;
  ctx.lineJoin = 'round';
  for (const [dx, dy, c] of (o.sh || [])) {
    if (o.stroke) { ctx.lineWidth = o.stroke[0]; ctx.strokeStyle = c; ctx.strokeText(s, dx, dy + yo); }
    ctx.fillStyle = c; ctx.fillText(s, dx, dy + yo);
  }
  if (o.stroke) { ctx.lineWidth = o.stroke[0]; ctx.strokeStyle = o.stroke[1]; ctx.strokeText(s, 0, yo); }
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fillText(s, 0, yo); }
  ctx.restore(); return size;
}
function tw(s, o) { ctx.save(); setF(o, o.size || 100); const w = ctx.measureText(s).width; ctx.restore(); return w; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// o adesivo: caixa com borda de tinta e sombra dura
function sticker(s, x, y, o = {}) {
  const sc = o.sc ?? 1; if (sc <= 0.001) return;
  const size = o.size || 60, padX = o.padX ?? size * 0.5, padY = o.padY ?? size * 0.32, r = o.r ?? size * 0.3;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(sc, sc);
  if (o.a != null) ctx.globalAlpha *= cl(o.a);
  const fo = { size, w: o.w || 900, fam: o.fam, st: o.st || 'se', ls: o.ls };
  setF(fo, size);
  let w = ctx.measureText(s).width + padX * 2; const asc = ctx.measureText('H').actualBoundingBoxAscent, h = asc + padY * 2;
  if (o.maxW && w > o.maxW) { const k = o.maxW / w; ctx.scale(k, k); }

  if (o.sh !== false) { ctx.fillStyle = o.sh || C.ink; rr(-w / 2 + sd, -h / 2 + sd, w, h, r); ctx.fill(); }
  ctx.fillStyle = o.bg || C.y; rr(-w / 2, -h / 2, w, h, r); ctx.fill();
  ctx.lineWidth = o.bw ?? Math.max(4, size * 0.085); ctx.strokeStyle = o.bc || C.ink; ctx.stroke();
  ctx.fillStyle = o.fg || C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, 0, asc / 2);
  ctx.restore(); return { w, h };
}
function bg(c) { ctx.fillStyle = c; ctx.fillRect(-300, -300, W + 600, H + 600); }
function bgV(stops, y0 = 0, y1 = H) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fillRect(-300, -300, W + 600, H + 600); }
const patC = {};
function dots(col, a = 0.18, sp = 22, r = 3.4, off = 0) {
  const k = col + sp + r; let p = patC[k];
  if (!p) { const o = document.createElement('canvas'); o.width = o.height = sp; const g = o.getContext('2d'); g.fillStyle = col;
    g.beginPath(); g.arc(sp * .25, sp * .25, r, 0, 7); g.fill(); g.beginPath(); g.arc(sp * .75, sp * .75, r * .7, 0, 7); g.fill();
    p = patC[k] = ctx.createPattern(o, 'repeat'); }
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(off % sp, (off * 0.5) % sp); ctx.fillStyle = p; ctx.fillRect(-300, -300, W + 600, H + 600); ctx.restore();
}
function rays(cx, cy, n, col, a, rot, r = 2800) {
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.translate(cx, cy); ctx.rotate(rot);
  for (let i = 0; i < n; i++) { const a0 = i * 2 * Math.PI / n, a1 = a0 + Math.PI / n; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a1); ctx.closePath(); ctx.fill(); }
  ctx.restore();

// as palavras passando ao fundo, só no contorno
function marquee(s, col, a, size, speed, t, o = {}) {
  ctx.save(); ctx.globalAlpha *= a; ctx.rotate(o.rot || 0);
  setF({ st: o.st || 'xc' }, size); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const unit = ctx.measureText(s + '  ').width; const rows = Math.ceil((H + 800) / (size * 1.02));
  ctx.lineWidth = o.lw || 4; ctx.strokeStyle = col; ctx.fillStyle = col;
  for (let i = 0; i < rows; i++) {
    const y = -400 + i * size * 1.02, dir = i % 2 ? 1 : -1;
    let x = ((t * speed * dir) % unit) - unit * 2 - (i * 137 % unit);
    for (; x < W + 600; x += unit) { if (o.fill && i % 3 === 1) ctx.fillText(s, x, y); else ctx.strokeText(s, x, y); }
  }
  ctx.restore();
}
const SPARK = new Path2D('M0 -30 C5 -5 5 -5 30 0 C5 5 5 5 0 30 C-5 5 -5 5 -30 0 C-5 -5 -5 -5 0 -30 Z');
function spark(x, y, s, col, rot = 0) {
  if (s <= 0.01) return; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.fill(SPARK); ctx.lineWidth = 6 / s * s / s * s; ctx.lineWidth = 5.5; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.stroke(SPARK); ctx.restore();
}
const CLOUD = new Path2D('M0 0 a30 30 0 0 1 38 -32 a44 44 0 0 1 82 -8 a32 32 0 0 1 52 28 a24 24 0 0 1 -4 46 h-150 a26 26 0 0 1 -18 -34 Z');
function cloud(x, y, s, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = '#fff'; ctx.fill(CLOUD); ctx.lineWidth = 7; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.stroke(CLOUD); ctx.restore(); }
// a explosão do golpe: anel, brilhos e confete
function burst(t, t0, x, y, o = {}) {
  const d = t - t0; if (d < 0 || d > 1.2) return;
  const n = o.n || 14, R = o.R || 520, cols = o.cols || [C.y, C.p, C.w, C.lav, C.or];
  const pr = E.oc(cl(d / 0.45));
  if (d < 0.45) { ctx.save(); ctx.globalAlpha = 1 - pr; ctx.lineWidth = 26 * (1 - pr) + 2; ctx.strokeStyle = o.ring || C.w; ctx.beginPath(); ctx.arc(x, y, 60 + R * pr, 0, 7); ctx.stroke(); ctx.restore(); }
  const r = rng(Math.round(t0 * 100) + 7);
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + r() * 0.5, sp = (0.55 + r() * 0.6) * R, c = cols[i % cols.length];
    const q = E.oc(cl(d / 0.9)), px = x + Math.cos(ang) * sp * q, py = y + Math.sin(ang) * sp * q + 260 * d * d;

  }

  for (let i = 0; i < n; i++) { const y = r() * H, len = 200 + r() * 500, x = ((r() * W * 2 + t * (2400 + r() * 1800)) % (W + len * 2)) - len; ctx.lineWidth = 6 + r() * 10; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke(); }

function skyBg(t, o = {}) {
  bgV([[0, C.s1], [0.55, C.s2], [1, C.s3]]);
  dots('#fff', 0.15, 20, 3, 0);
}
// o ícone do app (o C branco com a sombra rosa), igual ao favicon
const CPATH = new Path2D('M242.2 67.0 L259.4 67.0 L270.5 68.0 L281.6 70.0 L296.8 74.6 L308.4 80.1 L315.5 84.7 L320.5 88.7 L330.6 99.3 L338.7 111.4 L343.7 121.5 L349.3 136.2 L352.3 147.3 L357.4 178.1 L358.9 201.8 L358.9 215.9 L270.5 215.9 L269.0 176.1 L267.0 164.4 L262.9 154.9 L256.9 148.8 L249.3 146.3 L242.7 146.3 L238.2 147.3 L231.6 150.8 L227.1 156.4 L223.6 165.0 L222.0 172.0 L220.5 189.2 L220.5 303.8 L221.5 316.4 L223.6 328.0 L228.1 338.6 L234.2 344.7 L238.7 346.7 L244.3 347.7 L249.8 347.7 L256.9 345.7 L259.9 343.7 L264.0 339.1 L267.0 333.1 L269.5 324.5 L271.5 309.4 L272.5 280.1 L305.4 280.1 L358.9 280.1 L358.4 304.3 L355.8 328.5 L352.3 346.7 L346.3 365.9 L339.7 380.0 L332.1 391.7 L321.5 403.3 L308.4 412.9 L295.8 418.9 L280.6 423.5 L269.0 425.5 L257.9 426.5 L239.2 426.5 L214.5 423.0 L194.8 416.4 L186.7 412.4 L176.1 405.3 L161.5 391.2 L155.4 383.1 L148.3 371.0 L138.7 347.2 L132.7 322.5 L128.6 294.2 L126.6 262.9 L126.6 231.6 L128.1 205.8 L131.2 182.1 L134.7 164.4 L141.8 141.2 L150.9 121.5 L157.9 110.4 L163.5 103.4 L180.1 87.7 L191.2 80.6 L205.9 74.1 L225.1 69.0 Z');
function icon(x, y, size, sx = 1, sy = 1, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx * size / 512, sy * size / 512); ctx.translate(-256, -256);
  ctx.fillStyle = C.ink; rr(26, 26, 512, 512, 116); ctx.fill();
  const g = ctx.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#1A68CC'); g.addColorStop(1, '#4FA3EE');

  ctx.save(); rr(20, 20, w - 40, h - 40, 58); ctx.clip(); ctx.translate(20, 20); fn(w - 40, h - 40); ctx.restore();

// ---------- a Monstra (do cenário do login) ----------
const MON = {
  bracos: ['M1484 488 Q1500 440 1556 452', 'M1716 488 Q1702 438 1664 450'],
  chifres: ['M1530 300 C1512 262 1514 236 1528 220 C1542 244 1556 270 1562 292 Z', 'M1670 300 C1688 262 1686 236 1672 220 C1658 244 1644 270 1638 292 Z'].map(d => new Path2D(d)),
  corpo: new Path2D('M1470 500 C1466 368 1518 262 1600 262 C1682 262 1734 368 1730 500 Z'),
  sombra: new Path2D('M1688 300 C1718 344 1732 410 1730 500 L1702 500 C1704 410 1694 346 1674 306 Z'),
  boca: new Path2D('M1546 404 Q1600 450 1654 404 Q1600 422 1546 404 Z'),

  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-1600, -500);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const pa of MON.chifres) { ctx.fillStyle = C.y; ctx.fill(pa); ctx.lineWidth = 7; ctx.strokeStyle = C.ink; ctx.stroke(pa); }

    if (pisca > 0.3) { ctx.beginPath(); ctx.arc(-7 + ex, 11 + ey, 13, 0, 7); ctx.fillStyle = C.ink; ctx.fill(); ctx.beginPath(); ctx.arc(-12 + ex, 5 + ey, 4.5, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }

  ctx.save(); ctx.globalAlpha = .9; ctx.fillStyle = C.pt; ctx.beginPath(); ctx.ellipse(1528, 388, 13, 7, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(1672, 388, 13, 7, 0, 0, 7); ctx.fill(); ctx.restore();
  ctx.restore();
}
function monstraBracos(x, y, s, onda = 0) {

  MON.bracosP.forEach((pa, i) => { ctx.save(); const px = i ? 1716 : 1484; ctx.translate(px, 488); ctx.rotate((i ? -1 : 1) * onda); ctx.translate(-px, -488);
