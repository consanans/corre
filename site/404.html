<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corre</title>
<meta name="theme-color" content="#0C0A0F">
<!-- v4.0 · reserva do Link na bio: se a regra do _redirects não pegar o /@nome, o Netlify mostra esta página e ela leva
     pro lugar certo (v4.29: o /clientes também). Qualquer outro endereço que não existe vai pro começo do Corre. -->
<script>(function(){var m=location.pathname.match(/^\/@([A-Za-z0-9_.]{3,24})\/?$/);location.replace("/"+(m?location.search+"#/bio/"+m[1].toLowerCase():/^\/clientes\/?$/.test(location.pathname)?location.search+"#/clientes":""));})();</script>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0C0A0F;color:#F7F5EF;font:600 16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box;text-align:center}
  a{color:#0C0A0F;background:#FFE800;padding:12px 18px;border-radius:14px;text-decoration:none;display:inline-block;margin-top:12px;font-weight:800}
  b{font-size:40px;display:block;letter-spacing:-.02em}
</style>
</head>
<body>
<main><b>Corre</b><p>Abrindo…</p><a href="/">Ir pro Corre</a></main>
</body>
</html>
