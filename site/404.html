<script>

  var DESCULPAS = [

    'Pegou um patinete JET no Calçadão e não devolveu.',
    'Tá na fila do pastel da Feira desde terça.',
    'Foi pescar piapara no Tibagi. Disse que a de 4,850 tava mordendo.',
    'Virou NPC do Correverso e agora só fala de correal.',

    'Pegou a geada de 75. Ainda tá descongelando.',
    'Saiu no lambe-lambe do Muralzim e ninguém viu.',

    var el = $('desculpa'); di = (di + 1 + Math.floor(Math.random() * (DESCULPAS.length - 1))) % DESCULPAS.length;
    if(calmo){ el.textContent = DESCULPAS[di]; return; }

  }

  /* ---------- o 404 que cai do céu: cada pedaço é um corpo com peso, que quica, encosta no outro e dá pra jogar ---------- */

    corpos.forEach(function(c){ c.w = c.el.offsetWidth; c.h = c.el.offsetHeight; });
  }

    mede();
    var total = corpos.reduce(function(s, c){ return s + c.w; }, 0), gap = Math.max(4, (W - total) / 4), x = gap;

    });

  }
  function pinta(){ corpos.forEach(function(c){ c.el.style.transform = 'translate(' + c.x.toFixed(1) + 'px,' + c.y.toFixed(1) + 'px) rotate(' + c.a.toFixed(1) + 'deg)'; }); }
  function passo(dt){
    corpos.forEach(function(c){
      if(c.preso) return;
      c.vy += G * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.a += c.va * dt;
      var chao = H - CHAO - c.h;
      if(c.y > chao){ c.y = chao; if(Math.abs(c.vy) > 260){ c.vy = -c.vy * .42; c.va = -c.va * .6 + c.vx * .08; quica(c); } else { c.vy = 0; } c.vx *= .86; c.va *= .8; }
      if(c.x < 0){ c.x = 0; c.vx = Math.abs(c.vx) * .55; c.va = -c.va; }
      if(c.x + c.w > W){ c.x = W - c.w; c.vx = -Math.abs(c.vx) * .55; c.va = -c.va; }

    if(c.el.dataset.k === '0') fala(['Me solta!', 'Eu sou o zero!', 'Cadê a página?', 'Tô voando!'][Math.floor(Math.random() * 4)]);

    if(toques === 9) $('dica').textContent = 'Ok, a página não tá embaixo dos números.';

  var pupilas = [].slice.call(document.querySelectorAll('.pupila')), mon = $('monstra'), balao = $('balao'), falaT = 0;

    tentativas++;
    var vw = innerWidth, vh = innerHeight;
    caca = { x: vw * .5, y: vh * .4, vx: 220, vy: -160, t0: performance.now(), dur: 12000, fx: 0, fy: 0 };

    if(pegou){
      placar.textContent = 'ACHOU!'; festa(); tum(523, .2); setTimeout(function(){ tum(784, .2); }, 120);
      $('desculpa').textContent = tentativas > 1 ? 'Achou na ' + tentativas + 'ª tentativa. Ela tava em branco: alguém esqueceu de escrever.' : 'Achou! Mas ela tava em branco: alguém esqueceu de escrever.';
      fala('Era só um papel?!');
    } else {
      placar.textContent = 'ELA FUGIU'; $('desculpa').textContent = 'Fugiu de novo. Disse que volta depois do horário de pico.'; fala('Corre atrás!');
    }
    setTimeout(function(){ placar.classList.remove('on'); }, 2200);
  }
  folha.addEventListener('pointerdown', function(e){ e.preventDefault(); if(caca) acabou(true); });
  folha.addEventListener('keydown', function(e){ if(caca && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); acabou(true); } });
  /* o dedo chegando perto empurra a folha (ela foge, mas não sempre: senão ninguém pega) */
  window.addEventListener('pointermove', function(e){ if(caca){ caca.fx = e.clientX; caca.fy = e.clientY; } });
  $('procura').addEventListener('click', procura);
  function passoFolha(dt, agora){
    if(!caca) return;
    var vw = innerWidth, vh = innerHeight, c = caca, resta = Math.max(0, c.dur - (agora - c.t0));
    placar.textContent = 'Pega a página! ' + Math.ceil(resta / 1000) + ' s';
    if(resta <= 0){ acabou(false); return; }
    /* vento: muda de direção de leve; o dedo perto assusta */
    c.vx += (Math.sin(agora / 430) * 260 + (Math.random() - .5) * 400) * dt; c.vy += (Math.cos(agora / 610) * 220 + (Math.random() - .5) * 400) * dt;
    var dx = c.x - c.fx, dy = c.y - c.fy, d = Math.hypot(dx, dy);
    if(d < 140 && d > 1 && Math.sin(agora / 900) > -.3){ c.vx += dx / d * 1400 * dt; c.vy += dy / d * 1400 * dt; }
    var v = Math.hypot(c.vx, c.vy), max = calmo ? 140 : 380; if(v > max){ c.vx *= max / v; c.vy *= max / v; }
    c.x += c.vx * dt; c.y += c.vy * dt;
    if(c.x < 10){ c.x = 10; c.vx = Math.abs(c.vx); } if(c.x > vw - 68){ c.x = vw - 68; c.vx = -Math.abs(c.vx); }
    if(c.y < 60){ c.y = 60; c.vy = Math.abs(c.vy); } if(c.y > vh - 84){ c.y = vh - 84; c.vy = -Math.abs(c.vy); }
    folha.style.transform = 'translate(' + c.x.toFixed(1) + 'px,' + c.y.toFixed(1) + 'px) rotate(' + (Math.sin(agora / 180) * 18).toFixed(1) + 'deg)';
  }

  /* a festa: confete nas cores do Corre (amarelo, rosa, azul, branco e lilás; nada de verde) */
  function festa(){
    if(calmo) return;
    var cv = document.createElement('canvas'), x = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1), CORES = ['#FFE800', '#FF48B0', '#1A68CC', '#FFFFFF', '#C6A6FF', '#FF8A3D'], P = [], t0 = performance.now();
    cv.className = 'festa'; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; document.body.appendChild(cv); x.scale(dpr, dpr);
    for(var i = 0; i < 160; i++) P.push({ x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 900, vy: -Math.random() * 900 - 200, a: Math.random() * 6, va: (Math.random() - .5) * 12, c: CORES[i % CORES.length], w: 6 + Math.random() * 6 });
    (function anima(){
      var t = (performance.now() - t0) / 1000; x.clearRect(0, 0, innerWidth, innerHeight);
      P.forEach(function(p){ p.vy += 900 / 60; p.x += p.vx / 60; p.y += p.vy / 60; p.vx *= .99; p.a += p.va / 60; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); x.restore(); });
      if(t < 3.2) requestAnimationFrame(anima); else cv.remove();
    })();
  }

  /* o laço */
  var antes = performance.now();
  function laco(agora){
    var dt = Math.min(.033, (agora - antes) / 1000); antes = agora;
    passo(dt); pinta(); passoFolha(dt, agora);
    requestAnimationFrame(laco);
  }
  function comeca(){ arruma(true); pinta(); requestAnimationFrame(function(t){ antes = t; laco(t); }); }
  /* espera a letra chegar (senão o 4 nasce no tamanho da letra de reserva) */
  if(document.fonts && document.fonts.load) Promise.race([document.fonts.load('400 120px "Bagel Fat One"'), new Promise(function(r){ setTimeout(r, 1200); })]).then(comeca); else comeca();
  var rt = 0; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ arruma(false); }, 150); });
})();
</script>
