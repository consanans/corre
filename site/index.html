<script>/* v4.0 · o Link na bio: app.corresocial.com/@nome (o _redirects manda pra cá) vira #/bio/nome antes de qualquer arquivo carregar, pra css/ e js/ acharem a pasta certa */(function(){var m=location.pathname.match(/^\/@([A-Za-z0-9_.]{3,24})\/?$/);if(m)history.replaceState(null,"","/"+location.search+"#/bio/"+m[1].toLowerCase());else if(/^\/clientes\/?$/.test(location.pathname))history.replaceState(null,"","/"+location.search+"#/clientes");else if(/^\/studio\/?$/.test(location.pathname))history.replaceState(null,"","/"+location.search+"#/dia");})();</script>
<script>/* v5.02 · a Rede é dia e o Corre Studio é noite: a página já nasce na luz da parte da rota (sem piscar). Só quem tem login guardado vê a noite (quem não entrou cai no login, que é de dia); as Mensagens e o Rolo 360 seguem a parte de onde a pessoa veio, e a primeira página sem endereço é o Studio pra quem fixou "abrir direto aqui". O app.js confirma depois */(function(){try{var h=location.hash.replace(/^#\/?/,""),ls=localStorage,lg=false,i,k;for(i=0;i<ls.length;i++){k=ls.key(i);if(/^sb-.+-auth-token$/.test(k)){lg=true;break;}}if(!lg){k=ls.getItem("corre-demo-v2");lg=!!k&&k.indexOf('"user":{"id"')>-1;}var n=lg&&(/^(dia|caderninho|studio|horus|mural|atendente|piloto|banca|refs|houzi|marcas?|linkbio|corre|vendas|grana|estilo|planos|lojinha|monta|clientes)(\/|$)/.test(h)||(/^(msg|rolo)(\/|$)/.test(h)&&sessionStorage.getItem("corre-modo")==="studio")||(!h&&!!ls.getItem("corre-abre-studio")));if(n)document.documentElement.classList.add("escuro");}catch(e){}})();</script>
